<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruang Jejak - Catatan Aktivitas</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            color: var(--primary-color);
            margin-bottom: 5px;
        }

        header p {
            color: #6b7280;
            margin-top: 0;
        }

        .card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            margin-bottom: 20px;
        }

        form label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }

        form input, form textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            box-sizing: border-box;
        }

        form button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
        }

        form button:hover {
            background-color: #4338ca;
        }

        .jejak-item {
            border-left: 4px solid var(--primary-color);
            padding-left: 15px;
            margin-bottom: 15px;
            background: #f9fafb;
            padding: 15px;
            border-radius: 0 8px 8px 0;
        }

        .jejak-item h3 {
            margin: 0 0 5px 0;
            color: var(--primary-color);
        }

        .jejak-item .meta {
            font-size: 0.85rem;
            color: #9ca3af;
            margin-bottom: 10px;
        }

        .jejak-item p {
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Ruang Jejak</h1>
            <p>Rekam nama, aktivitas, dan laporan kegiatan harian di sini.</p>
        </header>

        <!-- Form Tambah Jejak -->
        <div class="card">
            <h2>Tambah Laporan Jejak Baru</h2>
            <form id="jejakForm">
                <label for="nama">Nama Lengkap</label>
                <input type="text" id="nama" placeholder="Masukkan nama..." required>

                <label for="aktivitas">Nama Aktivitas / Kegiatan</label>
                <input type="text" id="aktivitas" placeholder="Contoh: Membuat Program Robotik" required>

                <label for="laporan">Laporan / Catatan Aktivitas</label>
                <textarea id="laporan" rows="4" placeholder="Tuliskan detail laporan aktivitas di sini..." required></textarea>

                <button type="submit">Simpan Jejak</button>
            </form>
        </div>

        <!-- Daftar Ruang Jejak -->
        <div class="card">
            <h2>Daftar Jejak & Laporan</h2>
            <div id="daftarJejak">
                <!-- Data laporan akan masuk secara otomatis di sini -->
                <p style="color: #9ca3af; text-align: center;">Belum ada jejak tercatat.</p>
            </div>
        </div>
    </div>

    <!-- JavaScript untuk Menjalankan Fitur Tambah Data -->
    <script>
        const form = document.getElementById('jejakForm');
        const daftarJejak = document.getElementById('daftarJejak');

        // Array untuk menyimpan data sementara
        let listJejak = [];

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            // Ambil nilai dari input
            const nama = document.getElementById('nama').value;
            const aktivitas = document.getElementById('aktivitas').value;
            const laporan = document.getElementById('laporan').value;
            const tanggal = new Date().toLocaleDateString('id-ID', { 
                weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' 
            });

            // Simpan ke dalam objek data
            const dataBaru = { nama, aktivitas, laporan, tanggal };
            listJejak.unshift(dataBaru); // Masukkan ke urutan paling atas

            // Render ulang tampilan daftar jejak
            renderJejak();

            // Reset form
            form.reset();
        });

        function renderJejak() {
            if (listJejak.length === 0) {
                daftarJejak.innerHTML = '<p style="color: #9ca3af; text-align: center;">Belum ada jejak tercatat.</p>';
                return;
            }

            let htmlContent = '';
            listJejak.forEach((item) => {
                htmlContent += `
                    <div class="jejak-item">
                        <h3>${item.aktivitas}</h3>
                        <div class="meta">Oleh: <strong>${item.nama}</strong> | 📅 ${item.tanggal}</div>
                        <p>${item.laporan}</p>
                    </div>
                `;
            });

            daftarJejak.innerHTML = htmlContent;
        }
    </script>

</body>
</html>
